org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
android.useAndroidX=true
# The repository lives under a non-ASCII Windows path; AGP's conservative
# path check is overridden and builds verified to succeed on this setup.
android.overridePathCheck=true
# Kotlin incremental caches corrupt on non-ASCII Windows paths (file-lock
# errors in caches-jvm); disable to keep builds reproducible here.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
