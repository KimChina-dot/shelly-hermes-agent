name: shelly_hermes
description: "Shelly Hermes — Android agent workbench (Flutter 1.0)."
publish_to: 'none'

version: 2.2.0+3

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management for chat streams, task queues and settings.
  flutter_riverpod: ^2.6.1

  # HTTP client for the OpenAI-compatible model gateway.
  http: ^1.2.0

  # SHA-256 fingerprints for the MCP tool-catalog supply-chain guard.
  crypto: ^3.0.5

  # Pure-Dart syntax highlighting used by the code block component.
  highlight: ^0.7.0
  shared_preferences: ^2.5.5

  # Gallery photo picking for vision (image) messages; Android 13+ Photo Picker.
  image_picker: ^1.1.2

  # System file picker (SAF on Android) for text/code file attachments.
  file_selector: ^1.0.3

  # Temp directory for the on-disk conversation image cache.
  path_provider: ^2.1.5
  speech_to_text: ^7.4.0

  # Text-to-speech readout of assistant replies (zh-CN with en-US fallback).
  flutter_tts: ^4.2.3
  share_plus: ^13.3.0
  receive_sharing_intent: ^1.9.0

  # In-app update check: reads the running app version and opens the
  # release download page in the external browser.
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
