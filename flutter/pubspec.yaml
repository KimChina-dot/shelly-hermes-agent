name: shelly_hermes
description: "Shelly Hermes — Android agent workbench (Flutter 1.0)."
publish_to: 'none'

version: 2.1.0+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management for chat streams, task queues and settings.
  flutter_riverpod: ^2.6.1

  # HTTP client for the OpenAI-compatible model gateway.
  http: ^1.2.0

  # Pure-Dart syntax highlighting used by the code block component.
  highlight: ^0.7.0
  shared_preferences: ^2.5.5

  # Gallery photo picking for vision (image) messages; Android 13+ Photo Picker.
  image_picker: ^1.1.2

  # System file picker (SAF on Android) for text/code file attachments.
  file_selector: ^1.0.3

  # Temp directory for the on-disk conversation image cache.
  path_provider: ^2.1.5
  speech_to_text: ^7.4.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
