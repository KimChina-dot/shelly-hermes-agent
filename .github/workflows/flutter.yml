name: Flutter Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    working-directory: flutter
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: pub get
        run: flutter pub get
      - name: analyze
        run: flutter analyze
      - name: unit tests
        run: flutter test
      - name: debug APK
        run: flutter build apk --debug
      - name: release APK
        # Signing falls back to the debug key when android/key.properties is
        # absent (not committed) — see flutter/android/app/build.gradle.kts.
        run: flutter build apk --release
      - name: Generate checksums
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-debug.apk app-release.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: shelly-hermes-flutter-debug
          path: |
            flutter/build/app/outputs/flutter-apk/app-debug.apk
            flutter/build/app/outputs/flutter-apk/SHA256SUMS
            version-manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: shelly-hermes-flutter-release
          path: |
            flutter/build/app/outputs/flutter-apk/app-release.apk
            flutter/build/app/outputs/flutter-apk/SHA256SUMS
            version-manifest.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shelly-hermes-flutter-release
          path: release
      - name: Prepare release assets
        run: |
          cd release
          mv flutter/build/app/outputs/flutter-apk/app-release.apk shelly-hermes-${{ github.ref_name }}.apk
          mv flutter/build/app/outputs/flutter-apk/SHA256SUMS SHA256SUMS
          sed -i "s/app-release.apk/shelly-hermes-${{ github.ref_name }}.apk/" SHA256SUMS
          cp flutter/../version-manifest.json . 2>/dev/null || true
      - uses: softprops/action-gh-release@v2
        with:
          name: Shelly Hermes ${{ github.ref_name }}
          body: |
            Flutter Android release APK (release-signed, falls back to debug key when no signing config is committed).
            - APK: shelly-hermes-${{ github.ref_name }}.apk
            - Checksums: SHA256SUMS
          files: |
            release/shelly-hermes-${{ github.ref_name }}.apk
            release/SHA256SUMS
