name: Flutter Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    working-directory: flutter
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: pub get
        run: flutter pub get
      - name: analyze
        run: flutter analyze
      - name: unit tests
        run: flutter test
      - name: debug APK
        run: flutter build apk --debug
      - name: Generate checksums
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-debug.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: shelly-hermes-flutter-debug
          path: |
            flutter/build/app/outputs/flutter-apk/app-debug.apk
            flutter/build/app/outputs/flutter-apk/SHA256SUMS
            version-manifest.json
          if-no-files-found: error
