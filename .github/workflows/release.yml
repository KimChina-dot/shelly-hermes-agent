name: Release candidate (no publish)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify
      - run: npm audit --audit-level=high
      - run: npm run audit:dependencies -- --json
      - run: npm run gate:release
      - run: npm run package
      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = node -p "require('./version-manifest.json').version"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag/version mismatch" }
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-candidate-${{ github.sha }}
          path: release/
          if-no-files-found: error
# Deliberately no signing and no GitHub Release publishing step.
