name: Flutter E2E (emulator)
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      # Boots a real Android emulator (KVM on ubuntu runners) and runs the
      # integration suite against the real app: platform channels, storage
      # and rendering all genuine — the checks unit/widget tests cannot do.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 3072M
          disk-size: 6G
          script: |
            cd flutter
            flutter pub get
            flutter test integration_test -d emulator-5554
