name: Windows host
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run demo
      - run: node --import tsx hosts/windows/smoke.ts
