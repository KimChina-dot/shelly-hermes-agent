name: Windows host
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run demo
      - run: npm run smoke:windows
      - run: npm audit --audit-level=high
      - run: npm run gate:release
      - run: npm run package
      - name: Assert Windows artifact
        shell: pwsh
        run: |
          $dir = Get-ChildItem release -Directory | Select-Object -First 1
          if (-not $dir) { throw "release directory missing" }
          if (-not (Test-Path "$($dir.FullName)/hosts/windows/start.ps1")) { throw "start.ps1 missing" }
          if (-not (Test-Path "$($dir.FullName)/hosts/windows/start-desktop.ps1")) { throw "start-desktop.ps1 missing" }
          if (-not (Test-Path "$($dir.FullName)/hosts/windows/web/app.js")) { throw "desktop assets missing" }
          if (-not (Test-Path "$($dir.FullName)/SHA256SUMS")) { throw "SHA256SUMS missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: shelly-hermes-agent-windows
          path: release/
          if-no-files-found: error
