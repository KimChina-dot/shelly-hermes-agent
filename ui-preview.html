<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shelly Hermes UI Preview</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#dbeafe 0,transparent 38%),radial-gradient(circle at 85% 25%,#ede9fe 0,transparent 34%),linear-gradient(145deg,#eef2f7,#d9e0e8);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#172033}.phone{width:390px;height:844px;overflow:hidden;border-radius:48px;border:10px solid #16181d;background:linear-gradient(155deg,rgba(255,255,255,.86),rgba(239,244,250,.72));box-shadow:0 35px 90px rgba(30,41,59,.3);position:relative}.phone:before{content:"";position:absolute;z-index:9;top:10px;left:50%;transform:translateX(-50%);width:112px;height:30px;border-radius:20px;background:#111318}.page{height:100%;padding:56px 18px 22px;display:flex;flex-direction:column;gap:14px}.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 8px}.brand{font-size:24px;font-weight:720;letter-spacing:-.7px}.icon{width:38px;height:38px;border:1px solid rgba(255,255,255,.75);border-radius:14px;background:rgba(255,255,255,.42);backdrop-filter:blur(18px);display:grid;place-items:center;color:#64748b}.glass{background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.78);box-shadow:0 12px 32px rgba(71,85,105,.1),inset 0 1px rgba(255,255,255,.8);backdrop-filter:blur(22px);border-radius:24px}.workspace{padding:17px}.label{font-size:12px;color:#64748b;margin-bottom:8px}.row{display:flex;align-items:center;gap:11px}.folder{width:38px;height:38px;border-radius:13px;background:linear-gradient(140deg,#334155,#0f172a);display:grid;place-items:center;color:white}.name{font-size:15px;font-weight:650}.sub{font-size:12px;color:#7b8799;margin-top:2px}.task{padding:18px;flex:1;min-height:300px}.task h2{font-size:17px;margin:0 0 13px}.editor{height:145px;border-radius:18px;background:rgba(248,250,252,.58);border:1px solid rgba(148,163,184,.2);padding:15px;color:#536175;font-size:14px;line-height:1.55}.chips{display:flex;gap:8px;margin-top:13px}.chip{padding:7px 11px;border-radius:99px;background:rgba(255,255,255,.58);font-size:12px;color:#64748b}.status{padding:14px 16px;display:flex;align-items:center;justify-content:space-between}.dot{width:9px;height:9px;border-radius:50%;background:#34c759;box-shadow:0 0 0 5px rgba(52,199,89,.12)}.run{height:54px;border:0;border-radius:18px;background:#111827;color:white;font-size:15px;font-weight:670;box-shadow:0 12px 26px rgba(15,23,42,.25)}.approve{height:48px;border:1px solid rgba(148,163,184,.25);border-radius:17px;background:rgba(255,255,255,.55);font-weight:620;color:#334155}.nav{display:flex;justify-content:space-around;padding-top:2px;color:#94a3b8;font-size:11px}.active{color:#111827;font-weight:650}</style></head><body><main class="phone"><div class="page"><header class="top"><div class="brand">Shelly</div><div class="icon">•••</div></header><section class="glass workspace"><div class="label">当前工作区</div><div class="row"><div class="folder">⌘</div><div><div class="name">shelly-hermes-release</div><div class="sub">Android · feat/android-release</div></div></div></section><section class="glass task"><h2>想让 Hermes 做什么？</h2><div class="editor">描述一个开发任务，例如：检查项目中的文件执行流程，并修复审批后的写入逻辑…</div><div class="chips"><span class="chip">⌘ 工作区</span><span class="chip">＋ 上下文</span><span class="chip">模型设置</span></div></section><section class="glass status"><div class="row"><span class="dot"></span><div><div class="name">Hermes 已就绪</div><div class="sub">等待新的开发任务</div></div></div><span style="color:#94a3b8">›</span></section><button class="run">开始任务</button><button class="approve">查看变更并审批</button><nav class="nav"><span class="active">工作台</span><span>任务</span><span>设置</span></nav></div></main></body></html>
